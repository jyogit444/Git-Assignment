<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Git Assignment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Git Assignment!</h1>

        <h2>Git Assignment 1</h2>

        <p>This is my first HTML project using Git and GitHub.</p>

        <p>I am learning:</p>
        <ul style="text-align: left;">
            <li>Git Initialization</li>
            <li>Git Commit</li>
            <li>Git Push</li>
            <li>Git Pull</li>
            <li>SSH Authentication</li>
        </ul>

        <button onclick="showMessage()">Click Me!</button>
    </div>

    <script>
        function showMessage() {
            alert("Congratulations! My Git project is working!");
        }
    </script>

</body>
</html>
